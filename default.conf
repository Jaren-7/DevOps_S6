server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Endpoint liviano para Docker HEALTHCHECK y validación del pipeline.
    location = /health {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "healthy\n";
    }

    # Endpoint de demostración. Modificar este JSON permite comprobar
    # que un cambio en default.conf genera una nueva imagen y un redeploy.
    location = /api/info {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"app":"devops-nginx-app","status":"running","message":"Configuración Nginx desplegada automáticamente desde Azure DevOps"}\n';
    }

    # Sitio principal. no-store facilita visualizar inmediatamente
    # los cambios después de un nuevo despliegue durante el laboratorio.
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
